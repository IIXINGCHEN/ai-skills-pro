<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    :root {
      --bg: #07070a;
      --bg-elevated: #111116;
      --bg-card: #15151b;
      --bg-card-hover: #1b1b22;
      --border: #292930;
      --border-strong: #41414a;
      --text: #f5f5f7;
      --text-secondary: #b2b2b9;
      --text-tertiary: #85858e;
      --accent: #2997ff;
      --accent-glow: #2997ff33;
      --ambient-start: #2997ff;
      --ambient-end: #7c3aed;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.22);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.32);
      --transition: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-width: 320px;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color 180ms ease, color 180ms ease;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }

    .progress-bar {
      position: fixed;
      inset: 0 auto auto 0;
      z-index: 2000;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--ambient-start), var(--accent), var(--ambient-end));
    }

    .navbar {
      position: fixed;
      top: 16px;
      left: 50%;
      z-index: 1000;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      width: calc(100% - 32px);
      max-width: 1120px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(18px) saturate(150%);
      transform: translateX(-50%);
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      text-decoration: none;
    }
    .nav-brand__mark { color: var(--accent); }
    .nav-brand__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .dynamic-island { position: relative; justify-self: center; }
    .dynamic-island-pill {
      display: flex;
      align-items: center;
      min-height: 44px;
      max-width: min(360px, 45vw);
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid #34343c;
      border-radius: 999px;
      background: #000;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34);
      cursor: pointer;
      transition: transform 180ms var(--transition), border-color 180ms ease;
    }
    .dynamic-island-pill:hover { transform: translateY(-1px); border-color: #666672; }
    .island-status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 8px #34c759;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.6; transform: scale(1.2); } }
    .equalizer { display: flex; align-items: center; height: 12px; gap: 2px; }
    .equalizer span {
      width: 2px;
      height: 4px;
      border-radius: 2px;
      background: var(--accent);
      animation: equalize 1.1s ease-in-out infinite alternate;
    }
    .equalizer span:nth-child(2) { animation-delay: 160ms; }
    .equalizer span:nth-child(3) { animation-delay: 320ms; }
    @keyframes equalize { to { transform: scaleY(2.4); } }

    .island-popup {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      width: 320px;
      padding: 16px;
      border: 1px solid #34343c;
      border-radius: 8px;
      background: #050507;
      color: #f5f5f7;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: translateX(-50%) translateY(-8px) scale(0.98);
      transition: opacity 180ms ease, transform 180ms var(--transition), visibility 180ms ease;
    }
    .island-popup[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .island-popup__header,
    .island-player,
    .island-links { display: flex; align-items: center; }
    .island-popup__header { justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #2d2d34; }
    .island-popup__greeting { color: #a7a7af; font-size: 12px; font-weight: 700; }
    .island-clock { color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
    .island-player { gap: 12px; padding: 14px 0; }
    .island-player__icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
    }
    .island-player__title { font-size: 13px; font-weight: 700; }
    .island-player__artist { color: #94949d; font-size: 12px; }
    .island-links { gap: 8px; }
    .island-link-btn {
      flex: 1;
      min-height: 40px;
      padding: 10px 6px;
      border-radius: 6px;
      background: #15151b;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    .island-link-btn:hover { background: #23232b; }

    .icon-btn {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-elevated);
      cursor: pointer;
      transition: transform 180ms var(--transition), background-color 180ms ease;
    }
    .icon-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }

    .dynamic-island-pill:focus-visible,
    .icon-btn:focus-visible,
    .nav-brand:focus-visible,
    .island-link-btn:focus-visible,
    .button:focus-visible,
    .tab-button:focus-visible,
    .project-card:focus-visible,
    .article-item:focus-visible,
    .social-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .container { width: min(100%, 1120px); margin-inline: auto; padding-inline: 24px; }
    .hero {
      position: relative;
      display: flex;
      min-height: 72vh;
      align-items: flex-end;
      overflow: hidden;
      background: var(--bg-elevated);
      isolation: isolate;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, 0.54);
    }
    .hero-media {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--bg-elevated);
    }
    .hero-content { width: min(100%, 1120px); margin-inline: auto; padding: 148px 24px 72px; color: #f5f5f7; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      font-size: 13px;
      font-weight: 600;
    }
    .hero-title { max-width: 820px; margin-top: 20px; font-size: 64px; line-height: 1.08; letter-spacing: 0; overflow-wrap: anywhere; }
    .hero-name { color: color-mix(in srgb, var(--accent) 70%, white); }
    .hero-role { display: block; margin-top: 8px; color: rgba(245, 245, 247, 0.84); font-size: 28px; font-weight: 600; }
    .hero-desc { max-width: 65ch; margin-top: 20px; color: rgba(245, 245, 247, 0.8); font-size: 18px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 180ms var(--transition), background-color 180ms ease, border-color 180ms ease;
    }
    .button:hover { transform: translateY(-1px); }
    .button--primary { background: #f5f5f7; color: #171719; }
    .button--secondary { border-color: rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.42); color: #f5f5f7; }

    .marquee { overflow: hidden; padding-block: 20px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .marquee-track { display: inline-flex; gap: 12px; animation: marquee 28s linear infinite; }
    .marquee-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
    }
    @keyframes marquee { to { transform: translateX(-50%); } }

    .section { padding-block: 72px; }
    .section + .section { border-top: 1px solid var(--border); }
    .section-header { margin-bottom: 32px; }
    .section-kicker { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .section-title { margin-top: 8px; font-size: 40px; line-height: 1.2; letter-spacing: 0; }

    .bento-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .bento-card {
      grid-column: span 6;
      min-height: 190px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
      transition: transform 180ms var(--transition), background-color 180ms ease, border-color 180ms ease;
    }
    .bento-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); transform: translateY(-2px); }
    .bento-card--wide { grid-column: span 8; }
    .bento-card--narrow { grid-column: span 4; }
    .card-kicker { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .card-title { margin-top: 10px; font-size: 24px; line-height: 1.25; }
    .card-copy { max-width: 65ch; margin-top: 10px; color: var(--text-secondary); }
    .card-metric { display: inline-flex; margin-top: 18px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-weight: 700; }
    .card-number { color: var(--accent); font-family: var(--font-mono); font-size: 44px; font-weight: 800; line-height: 1; }
    .clock { margin-top: 12px; font-family: var(--font-mono); font-size: 30px; font-weight: 700; }
    .quote { margin-top: 12px; font-size: 19px; font-weight: 600; }
    .quote-author { margin-top: 8px; color: var(--text-tertiary); font-size: 13px; }

    .timeline { position: relative; display: grid; gap: 16px; padding-left: 32px; }
    .timeline::before { content: ""; position: absolute; inset: 0 auto 0 8px; width: 2px; background: var(--border); }
    .timeline-item {
      position: relative;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 180ms ease, transform 180ms var(--transition);
    }
    .timeline-item[data-revealed="true"] { opacity: 1; transform: translateY(0); }
    .timeline-item::before {
      content: "";
      position: absolute;
      top: 26px;
      left: -33px;
      width: 14px;
      height: 14px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: var(--bg);
    }
    .timeline-period { color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
    .timeline-role { margin-top: 6px; font-size: 20px; font-weight: 700; }
    .timeline-company { color: var(--text-secondary); font-size: 14px; }
    .timeline-description { max-width: 65ch; margin-top: 10px; color: var(--text-secondary); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .tag { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-tertiary); font-size: 11px; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .tab-button {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-elevated);
      cursor: pointer;
    }
    .tab-button[aria-pressed="true"], .tab-button:hover { border-color: var(--text); background: var(--text); color: var(--bg); }
    .projects-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .project-card {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      display: flex;
      min-width: 0;
      overflow: hidden;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: inherit;
      text-decoration: none;
      transform: perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      transition: transform 180ms var(--transition), border-color 180ms ease, box-shadow 180ms ease;
    }
    .project-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-lg); transform: perspective(900px) translateY(-3px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)); }
    .project-cover { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--bg-elevated); }
    .project-cover img { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--bg-elevated); }
    .project-cover__fallback { position: absolute; inset: 0; z-index: 0; }
    .project-cover img { position: relative; z-index: 1; }
    .project-body { display: flex; flex: 1; flex-direction: column; padding: 20px; }
    .project-title { font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
    .project-description {
      display: -webkit-box;
      flex: 1;
      margin-top: 8px;
      overflow: hidden;
      color: var(--text-secondary);
      font-size: 14px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .article-list { display: grid; gap: 10px; }
    .article-item {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: inherit;
      text-decoration: none;
      transition: transform 180ms var(--transition), border-color 180ms ease, background-color 180ms ease;
    }
    .article-item:hover { border-color: var(--border-strong); background: var(--bg-card-hover); transform: translateX(2px); }
    .article-title { font-weight: 700; }
    .article-meta { margin-top: 4px; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 12px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-block: 40px;
      border-top: 1px solid var(--border);
      color: var(--text-tertiary);
      font-size: 13px;
    }
    .social-list { display: flex; flex-wrap: wrap; gap: 14px; }
    .social-link { color: inherit; font-weight: 700; text-decoration: none; }
    .social-link:hover { color: var(--text); }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      z-index: 3000;
      max-width: min(90vw, 520px);
      padding: 10px 16px;
      border: 1px solid #3d3d46;
      border-radius: 6px;
      background: #050507;
      color: #fff;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transform: translate(-50%, 24px);
      transition: opacity 180ms ease, transform 180ms var(--transition);
    }
    .toast[data-visible="true"] { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .timeline-item { opacity: 1; transform: none; }
    }
    @media (max-width: 860px) {
      .hero { min-height: 68vh; }
      .hero-title { font-size: 48px; }
      .hero-role { font-size: 24px; }
      .section-title { font-size: 32px; }
      .bento-card, .bento-card--wide, .bento-card--narrow { grid-column: span 12; }
      .projects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .navbar { grid-template-columns: auto 1fr auto; }
      .nav-brand__name, .equalizer { display: none; }
      .dynamic-island-pill { max-width: 36vw; padding-inline: 10px; }
      .island-status-text { max-width: 72px; }
      .island-popup { width: min(300px, calc(100vw - 32px)); }
      .container, .hero-content { padding-inline: 16px; }
      .hero { min-height: 74vh; }
      .hero-content { padding-top: 132px; padding-bottom: 48px; }
      .hero-title { font-size: 40px; }
      .projects-grid { grid-template-columns: 1fr; }
      .article-item, .footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progress-bar" aria-hidden="true"></div>

  <header class="navbar">
    <a class="nav-brand" href="#hero">
      <span class="nav-brand__mark" aria-hidden="true">◆</span>
      <span class="nav-brand__name" id="brand-name"></span>
    </a>

    <div class="dynamic-island">
      <button class="dynamic-island-pill" id="island-pill" type="button" aria-expanded="false" aria-controls="island-popup">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="island-status-text" id="island-status-text"></span>
        <span class="equalizer" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <div class="island-popup" id="island-popup" role="group" aria-hidden="true" data-open="false">
        <div class="island-popup__header">
          <span class="island-popup__greeting" id="island-greeting"></span>
          <span class="island-clock" id="island-clock"></span>
        </div>
        <div class="island-player">
          <span class="island-player__icon" aria-hidden="true">♪</span>
          <span>
            <span class="island-player__title" id="player-title"></span>
            <span class="island-player__artist" id="player-artist"></span>
          </span>
        </div>
        <nav class="island-links" id="island-links"></nav>
      </div>
    </div>

    <div class="nav-actions">
      <button class="icon-btn" id="lang-toggle" type="button"></button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-pressed="false"></button>
    </div>
  </header>

  <main>
    <section class="hero" id="hero">
      <img class="hero-media" id="hero-media" width="1600" height="900" alt="" hidden />
      <div class="hero-content">
        <div class="badge"><span class="status-dot" aria-hidden="true"></span><span id="hero-status"></span></div>
        <h1 class="hero-title">
          <span id="hero-greeting"></span> <span class="hero-name" id="hero-name"></span>
          <span class="hero-role" id="hero-role"></span>
        </h1>
        <p class="hero-desc" id="hero-bio"></p>
        <div class="hero-actions">
          <a class="button button--primary" href="#projects"><span id="explore-cta"></span><span aria-hidden="true">↓</span></a>
          <button class="button button--secondary" id="copy-email" type="button"><span aria-hidden="true">□</span><span id="copy-email-label"></span></button>
        </div>
      </div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee-track"></div></div>

    <section class="section container" id="highlights">
      <header class="section-header"><p class="section-kicker" id="highlights-kicker"></p><h2 class="section-title" id="highlights-title"></h2></header>
      <div class="bento-grid" id="bento-grid"></div>
    </section>

    <section class="section container" id="timeline">
      <header class="section-header"><p class="section-kicker" id="timeline-kicker"></p><h2 class="section-title" id="timeline-title"></h2></header>
      <div class="timeline" id="timeline-list"></div>
    </section>

    <section class="section container" id="projects">
      <header class="section-header"><p class="section-kicker" id="projects-kicker"></p><h2 class="section-title" id="projects-title"></h2></header>
      <div class="filters" id="project-filters"></div>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

    <section class="section container" id="writing">
      <header class="section-header"><p class="section-kicker" id="writing-kicker"></p><h2 class="section-title" id="writing-title"></h2></header>
      <div class="article-list" id="article-list"></div>
    </section>
  </main>

  <footer class="footer container" id="contact"><span id="footer-legal"></span><nav class="social-list" id="social-list"></nav></footer>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" data-visible="false"></div>

  <!-- EXAMPLE: Replace every value below with user-supplied facts and newly derived visual tokens. -->
  <script type="application/json" id="site-data">
  {
    "settings": { "defaultLanguage": "en", "initialTheme": "system" },
    "profile": {
      "name": { "en": "EXAMPLE: Person name", "zh": "EXAMPLE: 姓名" },
      "title": { "en": "EXAMPLE: Professional title", "zh": "EXAMPLE: 职业头衔" },
      "status": { "en": "EXAMPLE: Availability status", "zh": "EXAMPLE: 当前状态" },

  </script>

  <script type="module">
    const SITE_DATA = JSON.parse(document.querySelector('#site-data').textContent);
    const root = document.documentElement;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
    const colorPattern = /^#[0-9a-f]{6}(?:[0-9a-f]{2})?$/i;
    const tokenMap = {
      bg: '--bg', bgElevated: '--bg-elevated', bgCard: '--bg-card', bgCardHover: '--bg-card-hover',
      border: '--border', borderStrong: '--border-strong', text: '--text', textSecondary: '--text-secondary',
      textTertiary: '--text-tertiary', accent: '--accent', accentGlow: '--accent-glow'
    };
    const fontStacks = {
      system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif',
      editorial: 'Georgia, "Times New Roman", serif',
      technical: '"SFMono-Regular", Consolas, "Liberation Mono", monospace'
    };

    let currentLanguage = SITE_DATA.settings.defaultLanguage;
    let currentTheme = resolveInitialTheme();
    let activeFilter = 'all';
    let toastTimer;

    function localized(value) {
      if (!value || typeof value !== 'object') return '';
      return String(value[currentLanguage] || value.en || value.zh || '');
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = String(text);
      return node;
    }

    function setText(id, value) {
      const node = document.getElementById(id);
      if (node) node.textContent = String(value || '');
    }

    function safeColor(value, fallback) {
      return colorPattern.test(String(value)) ? String(value) : fallback;
    }

    function safeUrl(value) {
      const raw = String(value || '').trim();
      if (/^#[A-Za-z][\w:.-]*$/.test(raw)) return raw;
      try {
        const parsed = new URL(raw, document.baseURI);
        return ['http:', 'https:'].includes(parsed.protocol) ? raw : '#';
      } catch {
        return '#';
      }
    }

    function safeMediaUrl(value) {
      const raw = String(value || '').trim();
      if (/^data:image\/(?:png|jpeg|webp|gif|avif);base64,[A-Za-z0-9+/=]+$/i.test(raw)) return raw;
      try {
        const parsed = new URL(raw, document.baseURI);
        return ['http:', 'https:'].includes(parsed.protocol) ? raw : '';
      } catch {
        return '';
      }
    }

    function configureLink(link, value) {
      const href = safeUrl(value);
      link.href = href;
      const absolute = /^https?:/i.test(href);
      if (absolute) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
    }

    function setMedia(image, media) {
      const src = safeMediaUrl(media && media.src);
      image.alt = localized(media && media.alt);
      if (!src) {
        image.hidden = true;
        return;
      }
      image.src = src;
      image.hidden = false;
      image.addEventListener('error', () => { image.hidden = true; }, { once: true });
    }

    function resolveInitialTheme() {
      try {
        const stored = localStorage.getItem('portfolio-theme');
        if (stored === 'dark' || stored === 'light') return stored;
      } catch {}
      if (SITE_DATA.settings.initialTheme === 'dark' || SITE_DATA.settings.initialTheme === 'light') {
        return SITE_DATA.settings.initialTheme;
      }
      return systemDark.matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      currentTheme = theme;
      root.dataset.theme = theme;
      const tokens = SITE_DATA.theme[theme];
      Object.entries(tokenMap).forEach(([key, cssName]) => {
        root.style.setProperty(cssName, safeColor(tokens[key], getComputedStyle(root).getPropertyValue(cssName).trim()));
      });
      root.style.setProperty('--ambient-start', safeColor(SITE_DATA.theme.ambientStart, tokens.accent));
      root.style.setProperty('--ambient-end', safeColor(SITE_DATA.theme.ambientEnd, tokens.accent));
      root.style.setProperty('--font', fontStacks[SITE_DATA.theme.fontMood] || fontStacks.system);
      const button = document.getElementById('theme-toggle');
      button.textContent = theme === 'dark' ? '☀' : '☾';
      button.setAttribute('aria-pressed', String(theme === 'dark'));
      button.setAttribute('aria-label', localized(SITE_DATA.ui.switchTheme));
      button.title = localized(SITE_DATA.ui.switchTheme);
    }

    function renderMarquee() {
      const track = document.getElementById('marquee-track');
      const fragment = document.createDocumentFragment();
      SITE_DATA.marquee.concat(SITE_DATA.marquee).forEach((label) => {
        const item = element('span', 'marquee-item');
        item.append(element('span', '', '◆'), document.createTextNode(String(label)));
        fragment.append(item);
      });
      track.replaceChildren(fragment);
    }

    function createTagList(tags) {
      const list = element('div', 'tag-list');
      tags.forEach((tag) => list.append(element('span', 'tag', tag)));
      return list;
    }

    function renderBento() {
      const grid = document.getElementById('bento-grid');
      const data = SITE_DATA.bento;

      const flagship = element('article', 'bento-card bento-card--wide');
      flagship.append(
        element('p', 'card-kicker', localized(data.flagship.tag)),
        element('h3', 'card-title', localized(data.flagship.title)),
        element('p', 'card-copy', localized(data.flagship.description)),
        element('p', 'card-metric', localized(data.flagship.metric))
      );

      const clock = element('article', 'bento-card bento-card--narrow');
      clock.append(element('p', 'card-kicker', localized(data.clock.label) + ' · ' + SITE_DATA.profile.location));
      const clockValue = element('p', 'clock', '--:--:--');
      clockValue.id = 'live-clock';
      clock.append(clockValue);

      const counter = element('article', 'bento-card bento-card--narrow');
      counter.append(
        element('p', 'card-number', String(data.counter.number) + data.counter.suffix),
        element('p', 'card-copy', localized(data.counter.label))
      );

      const philosophy = element('article', 'bento-card bento-card--wide');
      philosophy.append(
        element('p', 'card-kicker', localized(data.philosophy.tag)),
        element('blockquote', 'quote', '“' + localized(data.philosophy.quote) + '”'),
        element('p', 'quote-author', data.philosophy.author)
      );
      grid.replaceChildren(flagship, clock, counter, philosophy);
    }

    function renderTimeline() {
      const list = document.getElementById('timeline-list');
      const fragment = document.createDocumentFragment();
      SITE_DATA.timeline.forEach((item) => {
        const card = element('article', 'timeline-item');
        card.append(
          element('p', 'timeline-period', item.period),
          element('h3', 'timeline-role', localized(item.role)),
          element('p', 'timeline-company', item.company),
          element('p', 'timeline-description', localized(item.description)),
          createTagList(item.tags)
        );
        fragment.append(card);
      });
      list.replaceChildren(fragment);
      bindTimelineReveal();
    }

    function bindTimelineReveal() {
      const items = document.querySelectorAll('.timeline-item');
      if (reduceMotion.matches || !('IntersectionObserver' in window)) {
        items.forEach((item) => { item.dataset.revealed = 'true'; });
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.dataset.revealed = 'true';
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.2 });
      items.forEach((item) => observer.observe(item));
    }

    function projectCategories() {
      return Array.from(new Set(SITE_DATA.projects.map((project) => String(project.category))));
    }

    function renderFilters() {
      const filters = document.getElementById('project-filters');
      const fragment = document.createDocumentFragment();
      [{ value: 'all', label: localized(SITE_DATA.ui.allProjects) }]
        .concat(projectCategories().map((category) => ({ value: category, label: category })))
        .forEach((filter) => {
          const button = element('button', 'tab-button', filter.label);
          button.type = 'button';
          button.dataset.filter = filter.value;
          button.setAttribute('aria-pressed', String(activeFilter === filter.value));
          fragment.append(button);
        });
      filters.replaceChildren(fragment);
    }

    function renderProjects() {
      const grid = document.getElementById('projects-grid');
      const projects = activeFilter === 'all'
        ? SITE_DATA.projects
        : SITE_DATA.projects.filter((project) => project.category === activeFilter);
      const fragment = document.createDocumentFragment();

      projects.forEach((project) => {
        const card = element('a', 'project-card');
        configureLink(card, project.link);
        card.dataset.projectId = project.id;

        const cover = element('div', 'project-cover');
        const fallback = element('div', 'project-cover__fallback');
        fallback.style.background = 'linear-gradient(135deg, ' + safeColor(project.cover.start, '#1f2937') + ', ' + safeColor(project.cover.end, '#334155') + ')';
        fallback.setAttribute('aria-hidden', 'true');
        const image = element('img');
        image.width = 640;
        image.height = 400;
        image.loading = 'lazy';
        setMedia(image, project.media);
        cover.append(fallback, image);

        const body = element('div', 'project-body');
        body.append(
          element('h3', 'project-title', localized(project.title)),
          element('p', 'project-description', localized(project.description)),
          createTagList(project.tags)
        );
        card.append(cover, body);
        fragment.append(card);
      });
      grid.replaceChildren(fragment);
      bindTilt();
    }

    function renderArticles() {
      const list = document.getElementById('article-list');
      const fragment = document.createDocumentFragment();
      SITE_DATA.articles.forEach((article) => {
        const link = element('a', 'article-item');
        configureLink(link, article.link);
        const content = element('span');
        content.append(
          element('span', 'article-title', localized(article.title)),
          element('span', 'article-meta', article.category + ' · ' + article.date + ' · ' + localized(article.readTime))
        );
        link.append(content, element('span', '', '↗'));
        fragment.append(link);
      });
      list.replaceChildren(fragment);
    }

    function renderSocials() {
      const list = document.getElementById('social-list');
      const fragment = document.createDocumentFragment();
      SITE_DATA.socials.forEach((social) => {
        const link = element('a', 'social-link', social.name);
        configureLink(link, social.url);
        fragment.append(link);
      });
      list.replaceChildren(fragment);
    }

    function renderIslandLinks() {
      const links = document.getElementById('island-links');
      const items = [
        { label: localized(SITE_DATA.ui.navWorks), href: '#projects' },
        { label: localized(SITE_DATA.ui.navExperience), href: '#timeline' },
        { label: localized(SITE_DATA.ui.navContact), href: '#contact' }
      ];
      const fragment = document.createDocumentFragment();
      items.forEach((item) => {
        const link = element('a', 'island-link-btn', item.label);
        link.href = item.href;
        fragment.append(link);
      });
      links.replaceChildren(fragment);
    }

    function renderLanguage() {
      currentLanguage = currentLanguage === 'zh' ? 'zh' : 'en';
      root.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en';
      document.title = localized(SITE_DATA.ui.pageTitle);
      setText('brand-name', localized(SITE_DATA.profile.name));
      setText('island-status-text', localized(SITE_DATA.profile.status));
      setText('island-greeting', localized(SITE_DATA.ui.islandGreeting));
      setText('player-title', localized(SITE_DATA.ui.playerTitle));
      setText('player-artist', localized(SITE_DATA.ui.playerArtist));
      setText('hero-status', localized(SITE_DATA.profile.status));
      setText('hero-greeting', localized(SITE_DATA.ui.heroGreeting));
      setText('hero-name', localized(SITE_DATA.profile.name));
      setText('hero-role', localized(SITE_DATA.profile.title));
      setText('hero-bio', localized(SITE_DATA.profile.bio));
      setText('explore-cta', localized(SITE_DATA.ui.exploreCta));
      setText('copy-email-label', localized(SITE_DATA.ui.copyEmailCta));
      setText('highlights-kicker', localized(SITE_DATA.ui.highlightsTag));
      setText('highlights-title', localized(SITE_DATA.ui.highlightsTitle));
      setText('timeline-kicker', localized(SITE_DATA.ui.timelineTag));
      setText('timeline-title', localized(SITE_DATA.ui.timelineTitle));
      setText('projects-kicker', localized(SITE_DATA.ui.projectsTag));
      setText('projects-title', localized(SITE_DATA.ui.projectsTitle));
      setText('writing-kicker', localized(SITE_DATA.ui.writingTag));
      setText('writing-title', localized(SITE_DATA.ui.writingTitle));
      setText('footer-legal', localized(SITE_DATA.ui.footerLegal));
      setMedia(document.getElementById('hero-media'), SITE_DATA.profile.media);

      const languageButton = document.getElementById('lang-toggle');
      languageButton.textContent = currentLanguage === 'zh' ? 'EN' : '中';
      languageButton.setAttribute('aria-label', localized(SITE_DATA.ui.switchLanguage));
      languageButton.title = localized(SITE_DATA.ui.switchLanguage);
      const islandButton = document.getElementById('island-pill');
      islandButton.setAttribute('aria-label', localized(SITE_DATA.ui.islandLabel));
      renderIslandLinks();
      renderBento();
      renderTimeline();
      renderFilters();
      renderProjects();
      renderArticles();
      renderSocials();
      applyTheme(currentTheme);
    }

    function updateClock() {
      let value = '--:--:--';
      try {
        value = new Intl.DateTimeFormat(currentLanguage === 'zh' ? 'zh-CN' : 'en-US', {
          timeZone: SITE_DATA.profile.timezone,
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).format(new Date());
      } catch {}
      setText('live-clock', value);
      setText('island-clock', value);
    }

    function setIslandOpen(open) {
      const button = document.getElementById('island-pill');
      const popup = document.getElementById('island-popup');
      button.setAttribute('aria-expanded', String(open));
      popup.dataset.open = String(open);
      popup.setAttribute('aria-hidden', String(!open));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.dataset.visible = 'true';
      toastTimer = setTimeout(() => { toast.dataset.visible = 'false'; }, 2600);
    }

    async function copyEmail() {
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(SITE_DATA.profile.email);
          copied = true;
        } else {
          const input = element('textarea');
          input.value = SITE_DATA.profile.email;
          input.setAttribute('readonly', '');
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.append(input);
          input.select();
          copied = document.execCommand('copy');
          input.remove();
        }
      } catch {}
      showToast(localized(copied ? SITE_DATA.ui.copySuccess : SITE_DATA.ui.copyError));
    }

    function bindTilt() {
      if (reduceMotion.matches || !window.matchMedia('(pointer: fine)').matches) return;
      document.querySelectorAll('.project-card').forEach((card) => {
        card.addEventListener('pointermove', (event) => {
          const rect = card.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width - 0.5;
          const y = (event.clientY - rect.top) / rect.height - 0.5;
          card.style.setProperty('--tilt-x', String(y * -6) + 'deg');
          card.style.setProperty('--tilt-y', String(x * 6) + 'deg');
        });
        card.addEventListener('pointerleave', () => {
          card.style.setProperty('--tilt-x', '0deg');
          card.style.setProperty('--tilt-y', '0deg');
        });
      });
    }

    document.getElementById('island-pill').addEventListener('click', () => {
      const open = document.getElementById('island-pill').getAttribute('aria-expanded') !== 'true';
      setIslandOpen(open);
    });
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.dynamic-island')) setIslandOpen(false);
    });
    document.addEventListener('keydown', (event) => {
      const trigger = document.getElementById('island-pill');
      if (event.key === 'Escape' && trigger.getAttribute('aria-expanded') === 'true') {
        setIslandOpen(false);
        trigger.focus();
      }
    });
    document.getElementById('island-links').addEventListener('click', () => setIslandOpen(false));
    document.getElementById('lang-toggle').addEventListener('click', () => {
      currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
      renderLanguage();
      updateClock();
    });
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('portfolio-theme', next); } catch {}
    });
    document.getElementById('copy-email').addEventListener('click', copyEmail);
    document.getElementById('project-filters').addEventListener('click', (event) => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      activeFilter = button.dataset.filter;
      renderFilters();
      renderProjects();
      const replacement = Array.from(document.querySelectorAll('#project-filters [data-filter]'))
        .find((item) => item.dataset.filter === activeFilter);
      replacement?.focus();
    });
    window.addEventListener('scroll', () => {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      const percent = total > 0 ? window.scrollY / total : 0;
      document.getElementById('progress-bar').style.width = String(percent * 100) + '%';
    }, { passive: true });
    systemDark.addEventListener('change', (event) => {
      let stored = null;
      try { stored = localStorage.getItem('portfolio-theme'); } catch {}
      if (!stored && SITE_DATA.settings.initialTheme === 'system') applyTheme(event.matches ? 'dark' : 'light');
    });

    renderMarquee();
    renderLanguage();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
