name: Validate Skills

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

# A newer run on the same ref supersedes the previous one; without this, rapid
# pushes pile up redundant full-suite runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run Skill Validation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile, skipping install"; fi

      - name: Run validation suite
        run: npm run validate

      - name: Smoke-test distillation export
        run: npm run export:distillation

      - name: Report result
        if: always()
        run: |
          echo "Validation gate finished. Check the logs above for details."
