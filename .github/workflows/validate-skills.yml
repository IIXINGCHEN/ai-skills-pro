name: Validate Skills

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Run Skill Validation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile, skipping install"; fi

      - name: Run validation gate
        run: npm run validate

      - name: Run trigger eval suite
        run: npm run eval

      - name: Run test suite
        run: npm test

      - name: Report result
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "Validation and tests passed."
          else
            echo "Validation or tests failed. Check the logs above for details."
            exit 1
          fi