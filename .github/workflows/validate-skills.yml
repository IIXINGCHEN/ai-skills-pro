name: Validate Skills

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Run Skill Validation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile, skipping install"; fi

      - name: Run validation gate
        run: npm run validate

      - name: Run trigger eval suite
        run: npm run eval

      - name: Run test suite
        run: npm test

      # The fourth gate. Without it a PR could merge with version drift, a stale
      # manifest, a CRLF file, a broken relative link, or a hardcoded absolute
      # path, because none of those fail validate/eval/test.
      - name: Run release gate
        run: npm run release-check