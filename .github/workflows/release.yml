name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request
        uses: changesets/action@v1
        with:
          version: npm run version
          # `changeset tag` only creates tags in the runner's local clone; it does
          # not push them. Without the push the release job "succeeds" while no tag
          # or GitHub release ever reaches the remote (the 3.x releases shipped
          # untagged). Push the tags the tag command just created.
          publish: npx changeset tag && git push origin --tags
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
