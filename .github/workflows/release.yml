name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request
        uses: changesets/action@v1
        with:
          version: npm run version
          # The action runs the publish command without a shell, so this must be a
          # single command (a `&&` chain is handed to npx as arguments). The script
          # runs `changeset tag` and then pushes the tags: `changeset tag` only
          # creates tags in the runner's local clone, and without the push no tag
          # ever reaches the remote (the 3.x releases shipped untagged).
          publish: node scripts/release-publish.mjs
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
