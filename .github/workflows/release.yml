name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: npm run version
          # The action runs the publish command without a shell, so this must be a
          # single command (a `&&` chain is handed to npx as arguments). The script
          # runs `changeset tag`, pushes the tags, and creates the GitHub release:
          # `changeset tag` only creates tags in the runner's local clone, and
          # without the push no tag ever reaches the remote.
          publish-script: node scripts/release-publish.mjs
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"
          # v2 renamed the inputs and no longer reads the token from the
          # GITHUB_TOKEN environment variable; it goes to github-token instead.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The action's own tag and release creation is left off: it stays
          # silent for a private package (nothing is published to report), so
          # scripts/release-publish.mjs does the tagging and the release itself.
          create-github-releases: false
          push-git-tags: false
        env:
          # Kept so `gh` inside release-publish.mjs is authenticated.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
